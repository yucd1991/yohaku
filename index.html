<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yohaku 余白</title>
<meta name="description" content="週に一度、思想と問いのための余白。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBFAF6;
    --line: #E4E0D4;
    --ink: #3A362E;
    --ink-faint: #A39C8A;
    --pencil: #8A7F63;
    --card: #F3F0E6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1E1C17;
      --line: #35311F;
      --ink: #E8E3D6;
      --ink-faint: #8B8371;
      --pencil: #B8AC8A;
      --card: #262319;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    background-image: repeating-linear-gradient(transparent, transparent 38px, var(--line) 39px);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 300;
    line-height: 1.9;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 32px; }

  header {
    padding: 90px 0 40px;
    text-align: center;
  }
  .kanji {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 54px;
    font-weight: 800;
    letter-spacing: 0.15em;
    margin-bottom: 6px;
  }
  .romaji {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 22px;
    color: var(--pencil);
    margin-bottom: 22px;
  }
  .tagline {
    font-size: 14.5px;
    color: var(--ink-faint);
  }

  main { padding: 40px 0 120px; }

  .issue-card {
    display: block;
    text-decoration: none;
    color: var(--ink);
    padding: 30px 0;
    border-bottom: 1px dashed var(--line);
  }
  .issue-card:first-child { padding-top: 0; }
  .issue-card:hover .issue-title { color: var(--pencil); }

  .issue-week {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 19px;
    color: var(--pencil);
    margin-bottom: 6px;
  }
  .issue-title {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.6;
    margin: 0 0 8px;
  }
  .issue-thinker {
    font-size: 13px;
    color: var(--ink-faint);
  }

  .empty-state {
    padding: 48px 0;
    text-align: center;
    color: var(--ink-faint);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 19px;
  }

  footer {
    text-align: center;
    padding: 40px 0 60px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 17px;
    color: var(--ink-faint);
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="kanji">余白</div>
    <div class="romaji">Yohaku</div>
    <p class="tagline">週に一度、立ち止まって考えるための場所</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="issue-list">
      <div class="empty-state">— まだ号がありません ——</div>
    </div>
  </div>
</main>

<footer>Yohaku — 自分のための、静かな思考のログ</footer>

<script>
  fetch('reports/index.json')
    .then(r => r.json())
    .then(issues => {
      if (!issues || issues.length === 0) return;
      const list = document.getElementById('issue-list');
      list.innerHTML = '';
      issues.slice().reverse().forEach(issue => {
        const a = document.createElement('a');
        a.className = 'issue-card';
        a.href = 'reports/' + issue.file;
        a.innerHTML = `
          <div class="issue-week">week ${String(issue.number).padStart(2,'0')} ・ ${issue.date}</div>
          <h2 class="issue-title">${issue.title}</h2>
          <div class="issue-thinker">${issue.thinker || ''}</div>
        `;
        list.appendChild(a);
      });
    })
    .catch(() => {});
</script>

</body>
</html>
